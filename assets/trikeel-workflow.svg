<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-labelledby="t d">
  <title id="t">Trikeel workflow</title>
  <desc id="d">Three files feed one AI coding agent: SUPERVISOR.md (how to work), STUDY.md (what we build) and the .env Vault (secrets, never in context). The agent runs a six-phase loop with five gates, and writes decisions back to STUDY.md.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Consolas, "DejaVu Sans Mono", monospace; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1E"/>
      <stop offset="1" stop-color="#121A3A"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E2B2A"/>
      <stop offset="0.5" stop-color="#10333A"/>
      <stop offset="1" stop-color="#0E2B2A"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1E2A4F"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="aCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38BDF8"/></marker>
    <marker id="aViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/></marker>
    <marker id="aAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FBBF24"/></marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FB7185"/></marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#dots)" opacity="0.55"/>

  <!-- Header: keel mark + title -->
  <g transform="translate(80,58)" filter="url(#glow)">
    <rect x="0"  y="0"  width="96" height="18" rx="9" fill="#38BDF8"/>
    <rect x="14" y="30" width="68" height="18" rx="9" fill="#A78BFA"/>
    <rect x="28" y="60" width="40" height="18" rx="9" fill="#FBBF24"/>
  </g>
  <text x="206" y="112" font-size="68" font-weight="800" fill="#FFFFFF" letter-spacing="5">TRIKEEL</text>
  <text x="208" y="150" font-size="27" fill="#94A3B8">Three files. One steady workflow for AI coding agents.</text>
  <g>
    <rect x="1090" y="82" width="430" height="44" rx="22" fill="#0F1730" stroke="#2A3868" stroke-width="2"/>
    <text x="1305" y="111" font-size="19" font-weight="600" fill="#CBD5E1" text-anchor="middle">Supervisor-led  ·  Token-lean  ·  Secret-safe</text>
  </g>

  <!-- Section label -->
  <text x="80" y="214" font-size="16" font-weight="700" fill="#38BDF8" letter-spacing="4">THE TRIAD</text>

  <!-- Card 1: Supervisor -->
  <g transform="translate(80,236)">
    <rect width="440" height="280" rx="22" fill="#0F1730" stroke="#38BDF8" stroke-opacity="0.65" stroke-width="2"/>
    <rect x="24" y="0" width="64" height="6" rx="3" fill="#38BDF8"/>
    <circle cx="48" cy="56" r="22" fill="#38BDF8"/>
    <text x="48" y="64" font-size="24" font-weight="800" fill="#0A0F1E" text-anchor="middle">1</text>
    <text class="mono" x="86" y="52" font-size="27" font-weight="700" fill="#FFFFFF">SUPERVISOR.md</text>
    <text x="86" y="80" font-size="19" font-weight="600" fill="#38BDF8">The Helm  ·  HOW to work</text>
    <line x1="24" y1="106" x2="416" y2="106" stroke="#22305E"/>
    <g font-size="20" fill="#CBD5E1">
      <circle cx="34" cy="143" r="4" fill="#38BDF8"/><text x="50" y="150">Phases, gates, stop rules</text>
      <circle cx="34" cy="181" r="4" fill="#38BDF8"/><text x="50" y="188">Debug protocol + token discipline</text>
      <circle cx="34" cy="219" r="4" fill="#38BDF8"/><text x="50" y="226">Loaded once per session</text>
    </g>
    <rect x="24" y="245" width="170" height="28" rx="14" fill="#0B2A3A" stroke="#38BDF8" stroke-opacity="0.6"/>
    <text x="109" y="264" font-size="14" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="1.5">ALWAYS LOADED</text>
  </g>

  <!-- Card 2: Study -->
  <g transform="translate(580,236)">
    <rect width="440" height="280" rx="22" fill="#0F1730" stroke="#A78BFA" stroke-opacity="0.65" stroke-width="2"/>
    <rect x="24" y="0" width="64" height="6" rx="3" fill="#A78BFA"/>
    <circle cx="48" cy="56" r="22" fill="#A78BFA"/>
    <text x="48" y="64" font-size="24" font-weight="800" fill="#0A0F1E" text-anchor="middle">2</text>
    <text class="mono" x="86" y="52" font-size="27" font-weight="700" fill="#FFFFFF">STUDY.md</text>
    <text x="86" y="80" font-size="19" font-weight="600" fill="#A78BFA">The Chart  ·  WHAT we build</text>
    <line x1="24" y1="106" x2="416" y2="106" stroke="#22305E"/>
    <g font-size="20" fill="#CBD5E1">
      <circle cx="34" cy="143" r="4" fill="#A78BFA"/><text x="50" y="150">Mission, scope, non-goals</text>
      <circle cx="34" cy="181" r="4" fill="#A78BFA"/><text x="50" y="188">Architecture + decisions log</text>
      <circle cx="34" cy="219" r="4" fill="#A78BFA"/><text x="50" y="226">Single source of truth</text>
    </g>
    <rect x="24" y="245" width="150" height="28" rx="14" fill="#241B45" stroke="#A78BFA" stroke-opacity="0.6"/>
    <text x="99" y="264" font-size="14" font-weight="700" fill="#A78BFA" text-anchor="middle" letter-spacing="1.5">ON DEMAND</text>
  </g>

  <!-- Card 3: Vault -->
  <g transform="translate(1080,236)">
    <rect width="440" height="280" rx="22" fill="#0F1730" stroke="#FBBF24" stroke-opacity="0.65" stroke-width="2"/>
    <rect x="24" y="0" width="64" height="6" rx="3" fill="#FBBF24"/>
    <circle cx="48" cy="56" r="22" fill="#FBBF24"/>
    <text x="48" y="64" font-size="24" font-weight="800" fill="#0A0F1E" text-anchor="middle">3</text>
    <text class="mono" x="86" y="52" font-size="27" font-weight="700" fill="#FFFFFF">.env  (Vault)</text>
    <text x="86" y="80" font-size="19" font-weight="600" fill="#FBBF24">The Keys  ·  WITH WHAT we connect</text>
    <line x1="24" y1="106" x2="416" y2="106" stroke="#22305E"/>
    <g font-size="20" fill="#CBD5E1">
      <circle cx="34" cy="143" r="4" fill="#FBBF24"/><text x="50" y="150">Keys and variables live here</text>
      <circle cx="34" cy="181" r="4" fill="#FBBF24"/><text x="50" y="188">Agent sees names, never values</text>
      <circle cx="34" cy="219" r="4" fill="#FBBF24"/><text x="50" y="226">Git-ignored by design</text>
    </g>
    <rect x="24" y="245" width="200" height="28" rx="14" fill="#3A2B0B" stroke="#FBBF24" stroke-opacity="0.6"/>
    <text x="124" y="264" font-size="14" font-weight="700" fill="#FBBF24" text-anchor="middle" letter-spacing="1.5">NEVER IN CONTEXT</text>
  </g>

  <!-- Arrows card -> agent -->
  <line x1="300" y1="522" x2="300" y2="596" stroke="#38BDF8" stroke-width="3" marker-end="url(#aCyan)"/>
  <text x="316" y="565" font-size="17" fill="#7DD3FC">read first, every session</text>
  <line x1="800" y1="522" x2="800" y2="596" stroke="#A78BFA" stroke-width="3" marker-end="url(#aViolet)"/>
  <text x="816" y="565" font-size="17" fill="#C4B5FD">read by section</text>
  <line x1="1300" y1="522" x2="1300" y2="596" stroke="#FBBF24" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#aAmber)"/>
  <g transform="translate(1300,556)">
    <circle r="17" fill="#0A0F1E" stroke="#FBBF24" stroke-width="2"/>
    <rect x="-7" y="-1" width="14" height="10" rx="2" fill="#FBBF24"/>
    <path d="M-4,-1 V-5 a4,4 0 0 1 8,0 V-1" fill="none" stroke="#FBBF24" stroke-width="2.2"/>
  </g>
  <text x="1326" y="561" font-size="17" fill="#FCD34D">names only</text>

  <!-- Agent bar -->
  <rect x="80" y="600" width="1440" height="96" rx="24" fill="url(#agent)" stroke="#34D399" stroke-width="2.5" filter="url(#glow)"/>
  <text x="800" y="643" font-size="31" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">THE AI CODING AGENT</text>
  <text x="800" y="674" font-size="19" fill="#9FB4C7" text-anchor="middle">Claude Code, Cursor, Codex, or any agent that reads files</text>

  <!-- Loop -->
  <text x="80" y="752" font-size="16" font-weight="700" fill="#34D399" letter-spacing="4">THE LOOP  ·  EVERY SLICE</text>
  <g font-weight="800" fill="#0A0F1E">
    <path d="M88,774 h200 l24,42 l-24,42 h-200 l24,-42 z" fill="#38BDF8"/>
    <text x="200" y="808" font-size="15" text-anchor="middle" opacity="0.75">P0</text>
    <text x="200" y="838" font-size="25" text-anchor="middle">Orient</text>

    <path d="M328,774 h200 l24,42 l-24,42 h-200 l24,-42 z" fill="#38BDF8"/>
    <text x="440" y="808" font-size="15" text-anchor="middle" opacity="0.75">P1</text>
    <text x="440" y="838" font-size="25" text-anchor="middle">Plan</text>

    <path d="M568,774 h200 l24,42 l-24,42 h-200 l24,-42 z" fill="#A78BFA"/>
    <text x="680" y="808" font-size="15" text-anchor="middle" opacity="0.75">P2</text>
    <text x="680" y="838" font-size="25" text-anchor="middle">Build</text>

    <path d="M808,774 h200 l24,42 l-24,42 h-200 l24,-42 z" fill="#34D399"/>
    <text x="920" y="808" font-size="15" text-anchor="middle" opacity="0.75">P3</text>
    <text x="920" y="838" font-size="25" text-anchor="middle">Verify</text>

    <path d="M1048,774 h200 l24,42 l-24,42 h-200 l24,-42 z" fill="#34D399"/>
    <text x="1160" y="808" font-size="15" text-anchor="middle" opacity="0.75">P4</text>
    <text x="1160" y="838" font-size="25" text-anchor="middle">Review</text>

    <path d="M1288,774 h200 l24,42 l-24,42 h-200 l24,-42 z" fill="#FBBF24"/>
    <text x="1400" y="808" font-size="15" text-anchor="middle" opacity="0.75">P5</text>
    <text x="1400" y="838" font-size="25" text-anchor="middle">Record</text>
  </g>

  <!-- Gates -->
  <rect x="808" y="880" width="464" height="86" rx="16" fill="#0F1730" stroke="#34D399" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1040" y="908" font-size="15" font-weight="700" fill="#34D399" text-anchor="middle" letter-spacing="3">DETERMINISTIC GATES</text>
  <text x="1040" y="934" font-size="18" fill="#CBD5E1" text-anchor="middle">G1 Build  ·  G2 Tests  ·  G3 Acceptance</text>
  <text x="1040" y="956" font-size="18" fill="#CBD5E1" text-anchor="middle">G4 Secrets  ·  G5 Review</text>

  <!-- Fail path -->
  <path d="M808,923 H680 V862" fill="none" stroke="#FB7185" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#aRed)"/>
  <text x="660" y="915" font-size="18" font-weight="600" fill="#FB7185" text-anchor="end">FAIL: observe, isolate, fix the root cause</text>
  <text x="660" y="941" font-size="18" fill="#FDA4AF" text-anchor="end">3 strikes: STOP and ask the human</text>

  <!-- Record writes back -->
  <path d="M1400,866 V890" stroke="#FBBF24" stroke-width="3" fill="none"/>
  <text x="1400" y="918" font-size="18" font-weight="600" fill="#FCD34D" text-anchor="middle">writes decisions + status</text>
  <text x="1400" y="942" font-size="18" fill="#FCD34D" text-anchor="middle">back to STUDY.md</text>

  <!-- Why it works -->
  <text x="80" y="1018" font-size="16" font-weight="700" fill="#F472B6" letter-spacing="4">WHY IT WORKS</text>
  <g transform="translate(80,1036)">
    <rect width="335" height="102" rx="18" fill="#0F1730" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="2"/>
    <text x="22" y="36" font-size="23" font-weight="800" fill="#38BDF8">Fewer tokens</text>
    <text x="22" y="64" font-size="17" fill="#CBD5E1">Context loads once, by section.</text>
    <text x="22" y="86" font-size="17" fill="#CBD5E1">Nothing is re-explained.</text>
  </g>
  <g transform="translate(448,1036)">
    <rect width="335" height="102" rx="18" fill="#0F1730" stroke="#A78BFA" stroke-opacity="0.5" stroke-width="2"/>
    <text x="22" y="36" font-size="23" font-weight="800" fill="#A78BFA">Fewer bugs</text>
    <text x="22" y="64" font-size="17" fill="#CBD5E1">One source of truth.</text>
    <text x="22" y="86" font-size="17" fill="#CBD5E1">Gates catch errors early.</text>
  </g>
  <g transform="translate(816,1036)">
    <rect width="335" height="102" rx="18" fill="#0F1730" stroke="#34D399" stroke-opacity="0.5" stroke-width="2"/>
    <text x="22" y="36" font-size="23" font-weight="800" fill="#34D399">Smoother flow</text>
    <text x="22" y="64" font-size="17" fill="#CBD5E1">Fixed phases and stop rules,</text>
    <text x="22" y="86" font-size="17" fill="#CBD5E1">so the agent never improvises.</text>
  </g>
  <g transform="translate(1184,1036)">
    <rect width="336" height="102" rx="18" fill="#0F1730" stroke="#FBBF24" stroke-opacity="0.5" stroke-width="2"/>
    <text x="22" y="36" font-size="23" font-weight="800" fill="#FBBF24">Safer by design</text>
    <text x="22" y="64" font-size="17" fill="#CBD5E1">Secrets stay in .env.</text>
    <text x="22" y="86" font-size="17" fill="#CBD5E1">The agent sees names only.</text>
  </g>

  <text x="800" y="1178" font-size="17" fill="#64748B" text-anchor="middle">github.com/TOUMO45/Trikeel   ·   MIT License</text>
</svg>
