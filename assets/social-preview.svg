<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Trikeel: three files, one steady workflow for AI coding agents">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Consolas, "DejaVu Sans Mono", monospace; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1E"/><stop offset="1" stop-color="#151F45"/></linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#1E2A4F"/></pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)" opacity="0.55"/>
  <g transform="translate(100,150) scale(1.5)" filter="url(#glow)">
    <rect x="0" y="0" width="96" height="18" rx="9" fill="#38BDF8"/>
    <rect x="14" y="30" width="68" height="18" rx="9" fill="#A78BFA"/>
    <rect x="28" y="60" width="40" height="18" rx="9" fill="#FBBF24"/>
  </g>
  <text x="290" y="235" font-size="112" font-weight="800" fill="#FFFFFF" letter-spacing="8">TRIKEEL</text>
  <text x="294" y="300" font-size="38" fill="#94A3B8">Three files. One steady workflow.</text>
  <text x="294" y="346" font-size="27" fill="#64748B">A supervisor-led pattern for AI coding agents.</text>
  <g transform="translate(100,430)">
    <rect width="320" height="76" rx="18" fill="#0F1730" stroke="#38BDF8" stroke-opacity="0.7" stroke-width="2"/>
    <text class="mono" x="160" y="35" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">SUPERVISOR.md</text>
    <text x="160" y="60" font-size="18" fill="#38BDF8" text-anchor="middle">HOW to work</text>
  </g>
  <g transform="translate(480,430)">
    <rect width="320" height="76" rx="18" fill="#0F1730" stroke="#A78BFA" stroke-opacity="0.7" stroke-width="2"/>
    <text class="mono" x="160" y="35" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">STUDY.md</text>
    <text x="160" y="60" font-size="18" fill="#A78BFA" text-anchor="middle">WHAT we build</text>
  </g>
  <g transform="translate(860,430)">
    <rect width="320" height="76" rx="18" fill="#0F1730" stroke="#FBBF24" stroke-opacity="0.7" stroke-width="2"/>
    <text class="mono" x="160" y="35" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">.env</text>
    <text x="160" y="60" font-size="18" fill="#FBBF24" text-anchor="middle">WITH WHAT, never in context</text>
  </g>
  <text x="640" y="590" font-size="22" fill="#64748B" text-anchor="middle">Fewer tokens  ·  Fewer bugs  ·  Smoother builds</text>
</svg>
