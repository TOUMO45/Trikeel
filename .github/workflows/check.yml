name: trikeel-check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate template
        run: python3 scripts/trikeel_check.py template --strict
      - name: Validate example
        run: python3 scripts/trikeel_check.py examples/invoice-reminder --strict
      - name: Example Supervisor matches template
        run: diff template/SUPERVISOR.md examples/invoice-reminder/SUPERVISOR.md
